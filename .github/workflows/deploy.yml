# Template: copy unchanged to .github/workflows/deploy.yml in each site repo.
# Every push to main is built and published on the VPS by /usr/local/bin/site-deploy.
# The repo name is the VPS folder name, so the file is the same in every repo.
name: Deploy

on:
  push:
    branches: [main]
    # Skip pushes that only touch notes. Content markdown (e.g. src/content/**.md) still deploys.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'seo-audit/**'
      - '*-audit/**'
      - '.claude/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if this commit is already live
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Build and publish on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REPO: ${{ github.event.repository.name }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          # Pinned host key. Fingerprint SHA256:pOgfabjRN9rOh0pXZD+A33cQSHLolIpHFfbTSJmkFlw
          KNOWN_HOST: 144.91.101.152 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDvefiwGYsXzbsXAMn2vLrhnhLK0U1TF1zhoPtmUPV+8
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            ermal@144.91.101.152 "$REPO $FORCE" | tee "$RUNNER_TEMP/deploy.out"

      # site-deploy prints the page feed between two marker lines (seo-log/FEED.md). Keep it as an
      # artifact so /update-indexing can read what changed, per commit, without guessing from git.
      # No markers (nothing to deploy, or an old site-deploy) means no artifact, and that is fine.
      - name: Collect the page feed
        if: success()
        run: |
          sed -n '/^SEO-FEED-BEGIN$/,/^SEO-FEED-END$/p' "$RUNNER_TEMP/deploy.out" | sed '1d;$d' > changed-pages.json
          if [ -s changed-pages.json ] && jq -e . changed-pages.json >/dev/null; then
            jq -r '"### Page feed: \(.repo) \(.commit)",
              "",
              "added \(.added|length), changed \(.changed|length), removed \(.removed|length), unchanged \(.unchanged)" + (if .baseline then " (baseline run: no lists)" else "" end),
              "",
              (.added[]   | "- `+` " + .),
              (.changed[] | "- `~` " + .),
              (.removed[] | "- `-` " + .)' changed-pages.json >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f changed-pages.json
          fi

      - name: Save the page feed
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changed-pages
          path: changed-pages.json
          retention-days: 90
          if-no-files-found: ignore
