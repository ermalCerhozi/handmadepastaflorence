# RECOMMENDED, NOT INSTALLED. Nothing in this repo deploys this file.
#
# Checked live on 2026-10-06 with `curl -sI -H "Accept-Encoding: gzip"`:
# HTML is gzipped, but /_astro/*.js, /sitemap-0.xml (158 KB), /llms.txt and
# /robots.txt come back uncompressed. That matches the stock Ubuntu nginx.conf,
# where `gzip on;` is set but the `gzip_types` line is commented out, so only
# text/html is compressed. Caching headers were fine and are not touched here.
#
# To install: put these lines in the handmadepastaflorence.com server block (or
# the http block if every site on the box should get them), then
#   sudo nginx -t && sudo systemctl reload nginx
# Verify:
#   curl -s -o /dev/null -D - -H "Accept-Encoding: gzip" \
#     https://handmadepastaflorence.com/sitemap-0.xml | grep -i content-encoding

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
gzip_types
  text/css
  text/plain
  text/xml
  application/xml
  application/javascript
  text/javascript
  application/json
  application/ld+json
  application/manifest+json
  image/svg+xml;
# Images (webp/png), fonts (woff2) and video (mp4) are already compressed; leave
# them out.
